sonar.projectName=PiSDK Swift
sonar.sourceEncoding=UTF-8
# Default scope is the repository; exclude everything outside handwritten SDK code.
sonar.exclusions=.build/**,.swiftpm/**,.pi/**,.github/**,Tests/**,integration/**,protocol/**,Sources/PiSDK/Contract/**,experiments/**,scripts/**,docs/**,coverage/**,Package.swift,**/*.md
sonar.coverageReportPaths=coverage/sonar.xml
