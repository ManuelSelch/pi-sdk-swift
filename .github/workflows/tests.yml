name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
      - run: python3 scripts/protocol-artifacts.py check
      - run: swift build
      - run: swift test
