name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server-integration:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integration/package-lock.json
      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
      - name: Test integration prerequisites
        run: node --test scripts/run-server-integration.test.mjs
      - name: Install locked published server
        run: npm ci --ignore-scripts --prefix integration
      - name: Test local Swift SDK against published server
        run: npm test --prefix integration
      - name: Retain integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: swift-server-integration-diagnostics
          path: integration/.artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  swift:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
      - run: python3 scripts/protocol-artifacts.py check
      - run: swift build
      - name: Test coverage converter
        run: python3 -m unittest discover -s scripts/sonar -p 'test_*.py'
      - run: swift test --enable-code-coverage
      - name: Convert Swift coverage
        run: python3 scripts/sonar/coverage_to_sonar.py "$(swift test --show-codecov-path)" coverage/sonar.xml
      - name: Check Sonar configuration
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_ORGANIZATION" || { echo '::error::Set SONAR_ORGANIZATION'; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo '::error::Set SONAR_PROJECT_KEY'; exit 1; }
          test -n "$SONAR_TOKEN" || { echo '::error::Set SONAR_TOKEN'; exit 1; }
      - name: SonarQube Cloud scan and quality gate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
